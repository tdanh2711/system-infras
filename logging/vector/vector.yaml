# =============================================================================
# GLOBAL CONFIGURATION
# =============================================================================
data_dir: "/vector/data"

# =============================================================================
# SOURCES
# =============================================================================
sources:
  docker_logs:
    type: docker_logs
    docker_host: unix:///var/run/docker.sock
    exclude_containers: ["system-vector", "system-caddy", "system-seq"]

  http_logs:
    type: http
    address: 0.0.0.0:9000

# =============================================================================
# TRANSFORMS
# =============================================================================
transforms:
  parse_logs:
    type: remap
    inputs: ["docker_logs"]
    source: |
      # 1. Tách project/service
      container = string!(.container_name)
      if starts_with(container, "/") { container = slice!(container, 1) }
      
      parts = split(container, "-")
      .project = get(parts, [0]) ?? "unknown"
      
      if length(parts) > 1 {
          .service = join(slice(parts, 1) ?? [], "-") ?? "unknown"
      } else {
          .service = "default"
      }

      # 2. Try to parse JSON
      if is_string(.message) {
          parsed, err = parse_json(.message)
          if err == null {
              .msg = parsed.msg || parsed.message || .message
              .level = parsed.level || parsed.severity || "info"
              .timestamp = parsed.timestamp || parsed.time || parsed.ts || .timestamp
              
              del(parsed.msg); del(parsed.message); del(parsed.level)
              del(parsed.severity); del(parsed.timestamp); del(parsed.time); del(parsed.ts)
              
              # SỬA LỖI WARNING: Phải gán kết quả merge vào root (.)
              . = merge!(., parsed)
              .message = .msg
          }
      }

      .level = downcase(to_string(.level) ?? "info")
      if .level == "warning" {
          .level = "warn"
      } else if .level == "fatal" || .level == "critical" {
          .level = "error"
      } else if .level == "trace" {
          .level = "debug"
      }

      # SỬA LỖI 400: Ép kiểu timestamp thành string theo chuẩn ISO 8601
      .@t = to_string!(.timestamp)
      .@m = .message
      .@l = .level
      .@i = .container_id

      del(.timestamp); del(.message); del(.level); del(.msg); del(.container_id); del(.container_name)
      .source = "docker"

  parse_http_logs:
    type: remap
    inputs: ["http_logs"]
    source: |
      .project = "caddy"
      .service = "proxy"
      if is_string(.body) {
          parsed, err = parse_json(.body)
          if err == null {
              .message = parsed.message || parsed.msg || .body
              .level = parsed.level || parsed.severity || "info"
              .timestamp = parsed.timestamp || parsed.time || .timestamp
              del(parsed.message); del(parsed.msg); del(parsed.level)
              del(parsed.severity); del(parsed.timestamp); del(parsed.time)
              . = merge!(., parsed)
          }
      }
      .level = downcase(to_string(.level) ?? "info")
      .@t = format_timestamp!(.timestamp, "%Y-%m-%dT%H:%M:%SZ")
      .@m = .message
      .@l = .level
      del(.timestamp); del(.message); del(.level); del(.body)
      .source = "http"

# =============================================================================
# SINKS
# =============================================================================
sinks:
  seq:
    type: http
    inputs: ["parse_logs", "parse_http_logs"]
    uri: "http://system-seq:80/api/events/raw?clef&apiKey=KeFsILMp6Y8VqAj5s2Bq"
    method: post
    encoding:
      codec: "json"
    framing:
      method: "newline_delimited"
    request:
      headers:
        Content-Type: "application/vnd.serilog.clef"
        X-Seq-ApiKey: "${SEQ_API_KEY}"
      concurrency: 10
      rate_limit_num: 100
      retry_attempts: 5
      retry_initial_backoff_secs: 1
      retry_max_duration_secs: 60
      timeout_secs: 30
    batch:
      max_events: 1
    buffer:
      type: disk
      max_size: 268435488
      when_full: block

  console_debug:
    type: console
    inputs: ["parse_logs", "parse_http_logs"]
    encoding:
      codec: json