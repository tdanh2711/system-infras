version: "3.8"

services:
  # =============================================================================
  # CADDY - Reverse Proxy
  # =============================================================================
  caddy:
    image: caddy:2.8-alpine
    container_name: system-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-projects:/etc/caddy/projects:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    networks:
      - logging-net
    env_file:
      - .env
    environment:
      - CADDY_ADMIN=0.0.0.0:2019
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # SEQ - Log Server
  # =============================================================================
  # Seq is a structured log server with a powerful query UI
  # Free tier: 1 user, 50GB storage
  # Docs: https://docs.datalust.co/docs
  seq:
    image: datalust/seq:2024.1
    container_name: system-seq
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SEQ_ADMIN_PASSWORD=${SEQ_ADMIN_PASSWORD}
      - APPSETTINGS__RETENTIONDAYS=${SEQ_RETENTION_DAYS:-15}
    volumes:
      - ./logging/seq/data:/data
    networks:
      - logging-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =============================================================================
  # VECTOR - Log Collector
  # =============================================================================
  # Vector collects logs from Docker containers and forwards to Seq
  # Docs: https://vector.dev/docs/
  vector:
    image: timberio/vector:0.41.0-alpine
    container_name: system-vector
    restart: unless-stopped
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - ./logging/vector/vector.toml:/etc/vector/vector.toml:ro
      - ./logging/vector/data:/vector/data:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - logging-net
    depends_on:
      - seq
    environment:
      - SEQ_API_KEY=${SEQ_API_KEY}
    healthcheck:
      test: ["CMD", "vector", "validate", "--no-environment"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  logging-net:
    name: logging-net
    driver: bridge
